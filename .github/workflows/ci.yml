name: ci
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read, packages: write }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint --reporter=github # accessibility gate for the web app (biome.json); findings show as annotations on the PR
      - run: pnpm test
      - run: pnpm build

  # Never merge broken: a pull request must still produce deployable images and valid manifests.
  deployable:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize k8s/base > /dev/null && kubectl kustomize k8s/local > /dev/null
      - run: docker build --target api -t dex-api:ci . && docker build --target web -t dex-web:ci .

  images:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    strategy: { matrix: { target: [api, web] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          target: ${{ matrix.target }}
          tags: ghcr.io/joshthemenace/dex-${{ matrix.target }}:latest,ghcr.io/joshthemenace/dex-${{ matrix.target }}:${{ github.sha }}
