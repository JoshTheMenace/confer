apiVersion: apps/v1
kind: Deployment
metadata: { name: dex-api, labels: { app: dex-api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: dex-api } }
  template:
    metadata: { labels: { app: dex-api } }
    spec:
      # Hardening from Radar's cluster audit (docs/radar.md): no root, no privilege escalation, read-only disk.
      # The token is mounted again because the API now asks Kubernetes before an export; `confer-api` can do nothing else (consent.yaml).
      serviceAccountName: confer-api
      automountServiceAccountToken: true
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: dex-api } } }
      volumes: [{ name: tmp, emptyDir: {} }]
      containers:
        - name: api
          image: dex-api
          ports: [{ containerPort: 3000 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          envFrom: [{ secretRef: { name: dex-secrets } }]
          env:
            - { name: OTEL_SERVICE_NAME, value: dex-api }
            - { name: AUTH_CACHE_SECONDS, value: "300" } # sign-in remembered per pod: saves one Elasticsearch round trip per request
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            # Links every span/log/metric in Dash0 to the exact pod Radar shows.
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.deployment.name=dex-api" }
          readinessProbe: { httpGet: { path: /readyz, port: 3000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 3000 } }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 384Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: dex-api }
spec: { selector: { app: dex-api }, ports: [{ port: 3000 }] }
