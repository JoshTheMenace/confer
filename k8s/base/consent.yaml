# Consent as Kubernetes RBAC (docs/kubernetes-consent.md): a booth is a namespace, a share is a Role + RoleBinding in it.
#
# The CRD stores nothing: no Contact object is ever created, so no personal data lands in etcd. It only teaches the
# cluster the name `contacts.confer.dev`, so `kubectl auth can-i export contacts.confer.dev/<id>` and Radar resolve it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: { name: contacts.confer.dev }
spec:
  group: confer.dev
  scope: Namespaced
  names: { plural: contacts, singular: contact, kind: Contact }
  versions:
    - { name: v1, served: true, storage: true, schema: { openAPIV3Schema: { type: object } } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: confer-operator }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: confer-operator }
rules:
  - { apiGroups: [""], resources: [namespaces], verbs: [get, list, create] }
  - { apiGroups: [rbac.authorization.k8s.io], resources: [roles, rolebindings], verbs: [get, list, create, update, patch, delete] }
  # Kubernetes only lets you grant what you hold: the operator can hand out contact verbs because it has them all.
  - { apiGroups: [confer.dev], resources: [contacts], verbs: ["*"] }
  - { apiGroups: [authorization.k8s.io], resources: [subjectaccessreviews], verbs: [create] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: confer-operator }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: confer-operator }
subjects: [{ kind: ServiceAccount, name: confer-operator, namespace: dex }]
---
# The API may ask Kubernetes one question ("may this booth export this contact?") and do nothing else.
apiVersion: v1
kind: ServiceAccount
metadata: { name: confer-api }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: confer-api }
rules:
  - { apiGroups: [authorization.k8s.io], resources: [subjectaccessreviews], verbs: [create] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: confer-api }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: confer-api }
subjects: [{ kind: ServiceAccount, name: confer-api, namespace: dex }]
---
# The consent operator: the API image with its own command. It reconciles shares in Elasticsearch into RBAC.
apiVersion: apps/v1
kind: Deployment
metadata: { name: dex-consent-operator, labels: { app: dex-consent-operator } }
spec:
  replicas: 1
  selector: { matchLabels: { app: dex-consent-operator } }
  template:
    metadata: { labels: { app: dex-consent-operator } }
    spec:
      serviceAccountName: confer-operator
      automountServiceAccountToken: true
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        # It serves no traffic, so the probes read a heartbeat file the loop touches after every pass (Radar's audit asked for
        # probes): a loop that hangs is restarted, and a rollout counts as available only after a first pass.
        - name: operator
          image: dex-api
          command: ["node", "--import", "./dist/otel.js", "dist/operator.js"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          envFrom: [{ secretRef: { name: dex-secrets } }]
          env:
            - { name: OTEL_SERVICE_NAME, value: dex-consent-operator }
            # Node trusts the cluster's own CA for calls to the Kubernetes API.
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          livenessProbe: &alive
            exec: { command: ["node", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/alive').mtimeMs < 60000 ? 0 : 1)"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe: *alive
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
